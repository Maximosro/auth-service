server:
  port: 8091

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/devdb
    username: dev
    password: devpass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

auth:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY:keys/public.pem}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
